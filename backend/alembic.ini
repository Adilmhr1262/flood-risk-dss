# Alembic configuration for the Flood Risk Prediction and Early Warning
# Decision Support System.
#
# The database URL is NOT stored here: alembic/env.py reads DATABASE_URL
# from backend/.env (override with the DATABASE_URL environment variable).

[alembic]
script_location = alembic
prepend_sys_path = .

# Template used when generating new revisions with `alembic revision`.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

# Render `server_default` values when generating offline SQL.
render_as_batch = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
